services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tekravio_tracker
      MYSQL_USER: tracker
      MYSQL_PASSWORD: tracker
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  tracker:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/tekravio_tracker
      DB_USERNAME: tracker
      DB_PASSWORD: tracker
      JWT_SECRET: change-this-compose-secret-before-production-123456789
      SEED_DATA: "true"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
